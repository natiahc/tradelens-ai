name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Validate dashboard JavaScript
        run: |
          for script in frontend/dashboard/*.js; do
            node --check "$script"
          done
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path("frontend/dashboard/index.html").read_text()
          required = [
              "tlChatLauncher", "tlChatPanel", "tlChatMessages",
              "tlChatForm", "tlChatInput", "tlChatSave",
              "scCapital", "scFast", "scSlow", "diagRun",
          ]
          missing = [name for name in required if f'id="{name}"' not in html]
          assert not missing, f"Missing assistant UI controls: {missing}"
          for source in ("app.js", "small_capital.js", "diagnostics.js", "assistant.js"):
              assert f'src="./{source}"' in html
              assert Path("frontend/dashboard", source).is_file()
          PY
